[build-system]
requires = ["hatchling", "tomli"]
build-backend = "hatchling.build"

[project]
name = "my-little-ml-intern"
version = "0.1.0"
description = "Personal ML-intern: agent skills + code-enforced guardrails for ML/LLM experimentation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Roman Kryvokhyzha", email = "kriwohizha@gmail.com" }
]
keywords = ["ml", "llm", "agents", "claude", "skills", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11,<3.14"

dependencies = [
    # Core dependencies
    "rootutils >= 1.0.7",
    "hydra-core ~= 1.3.7",
    "hydra-colorlog == 1.2.0",
    "omegaconf ~= 2.3.1",
    "python-dotenv ~= 1.2.3",
    "rich ~= 15.0.0",
    "setuptools >= 84.0.0",
    "loguru ~= 0.7.3",
    "fire ~= 0.7.1",
    "joblib ~= 1.6.0",
    "pydantic >= 2.13.5, < 2.15.0",
    "packaging >= 26.3",

    # ML / training
    "torch ~= 2.13.0",
    "lightning ~= 2.6.6",
    "transformers ~= 5.17.0",
    "trl ~= 1.14.1",
    "peft ~= 0.21.0",
    "datasets ~= 5.0.1",
    "accelerate ~= 1.15.0",
    "safetensors ~= 0.8.0",

    # Tracking
    "trackio ~= 0.38.1",
    "wandb ~= 0.30.0",

    # Hub / data transfer
    "huggingface_hub[hf_xet] ~= 1.32.0",

    # Other dependencies
    "pandas ~= 3.0.6",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "notebook"},
]
lint = [
    "pre-commit",
    "ruff ~= 0.16.8",
]
test = [
    "pytest",
    "pytest-env",
]
notebook = [
    "notebook",
    "ipython",
    "ipywidgets",
]
gpu = [
    "bitsandbytes ~= 0.50.2",
]
# The async lanes load kernels-community/flash-attn3 through `kernels`. Keep this range equal to the
# `kernels` extra of the pinned transformers (5.17: >=0.16,<0.17) and move it with every transformers bump.
async = [
    "kernels ~= 0.16.2",
    # trl.experimental.async_grpo.openenv_harness (the loop-owning harness lane) imports openenv.
    "openenv ~= 0.7.0",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"
# Resolver-level opt-out for a package the user approved before its 1-week cooldown.
# The timestamp caps the opt-out: trl releases after the approval date stay blocked.
# Remove the entry together with its [tool.intern.deps.exceptions] twin once it expires.
exclude-newer-package = { trl = "2026-10-03T00:00:00Z", openenv = "2026-10-03T00:00:00Z" }
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.intern.deps]
# Dated, SELF-EXPIRING one-time exceptions to the >=1-week dependency-age gate —
# NOT a rule change. The gate downgrades the violation to info: until the date,
# then re-arms itself; remove entries once expired.
# trl 1.14.1 (released 2026-09-29) and openenv 0.7.0 (released 2026-10-01), user-approved 2026-10-03.
# The gate reads [project].dependencies only, so the openenv entry (async group) is the expiry
# date for its exclude-newer-package twin, not a gate check.
exceptions = { trl = "2026-10-06", openenv = "2026-10-08" }

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    ".ruff_cache",
    ".github",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]  # all rules can be found here: https://beta.ruff.rs/docs/rules/
ignore=[
    "E203",         # space before : (needed for how black formats slicing)
    "E731",         # do not assign a lambda expression, use a def
    "E741",         # do not use variables named 'l', 'O', or 'I'
    "F403",         # unable to detect undefined names
    "D100",         # missing docstring in public module
    "D101",         # missing docstring in public class
    "D102",         # missing docstring in public method
    "D103",         # missing docstring in public function
    "D104",         # missing docstring in public package
    "D105",         # missing docstring in magic method
    "D107",         # missing docstring in `__init__`
    "D203",         # incorrect-blank-line-before-class
    "D213",         # multi-line-summary-second-line
]

[tool.ruff.lint.per-file-ignores]
"scripts/python/*"=["E402"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.nbqa.config]
ruff = "pyproject.toml"

[tool.nbqa.addopts]
ruff = ["--extend-ignore=E402"]

[tool.nbqa.mutate]
ruff = 1

[tool.pytest.ini_options]
pythonpath = ["src", "."]

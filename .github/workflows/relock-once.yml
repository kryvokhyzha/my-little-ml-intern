# Temporary job. It puts the relocked uv.lock on this branch, because the cloud
# session that tested the lock cannot push a file of 525 KB. Delete this file after
# the run: the workflow token cannot change files under .github/workflows/.
name: relock-once

on:
  push:
    branches: [claude/magical-knuth-6oi06e]
    paths: [.github/workflows/relock-once.yml]

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - name: Regenerate the lock
        run: uv lock --upgrade
      - name: Refuse a lock that differs from the tested lock
        run:
          echo
          "728cbf9d9e60243249911754f23835d6f8124196069d44a73b99102a0d3d6899  uv.lock"
          | sha256sum --check
      - name: Commit the lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -F - <<'EOF'
          Relock uv.lock for TRL 1.14 and the dependency refresh

          The lock moves trl 1.8.0 -> 1.14.0 and transformers 5.14.1 -> 5.17.0,
          and it drops hf-transfer. uv 0.11.32 ran `uv lock --upgrade` in a
          temporary GitHub job. The job committed the lock only because its
          sha256 matched the lock that the cloud session tested: `uv run pytest`
          (526 passed) and the 000 smoke run (VERDICT: TRAIN_OK,
          final_train_loss=3.6047, the recorded value).

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01XWVg5E7YcjxndhoZvZSnLY
          EOF
          git push origin "HEAD:${GITHUB_REF_NAME}"

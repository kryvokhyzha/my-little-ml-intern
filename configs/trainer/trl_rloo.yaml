# RLOO (stable trl.RLOOTrainer): online RL with the REINFORCE leave-one-out baseline — each
# completion's advantage is its reward minus the mean reward of its siblings. Same reward
# function contract as trl_grpo, but no tools or environments. Needs a `prompt` column.
kind: trl_rloo
planned_tokens: null
peft: null
reward_funcs: []
args:
  _target_: trl.RLOOConfig
  output_dir: ${experiment_dir}/ckpts
  num_generations: 4
  max_completion_length: 256
  temperature: 1.0
  beta: 0.05 # KL penalty to the reference policy (TRL default)
  max_steps: -1
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-6
  lr_scheduler_type: constant
  lr_scheduler_kwargs: null
  logging_steps: 1
  eval_strategy: "no"
  save_steps: 200
  bf16: false
  seed: ${seed}

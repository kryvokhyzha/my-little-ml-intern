default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-executables-have-shebangs
      - id: check-docstring-first
      - id: detect-private-key
      - id: debug-statements
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev equal to the `ruff ~=` pin in [dependency-groups].lint (the CI lint job).
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types_or: [python, markdown]
        additional_dependencies: [tomli]
        # Vendored third-party text (Strunk 1918, Wikipedia) stays verbatim.
        exclude: "^\\.claude/skills/writing-clearly-and-concisely/references/(strunk-|signs-of-ai-writing)"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types_or: [markdown, yaml, toml, json, dockerfile, shell]
        additional_dependencies: ["prettier@3.0.3", "prettier-plugin-sh@0.13.1"]
        args: [--print-width=80, --prose-wrap=always]
        # experiments/ artifacts (budget.md, ledger.md, verify.md, metrics.jsonl) are
        # machine-parsed; prose-wrap would corrupt them.
        # The vendored writing references stay verbatim (re-vendor, never reformat).
        exclude: "^(README\\.md|experiments/|\\.claude/skills/writing-clearly-and-concisely/references/(strunk-|signs-of-ai-writing))"

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
        additional_dependencies: [ruff==0.16.8]
        args: ["--fix", "--show-files"]
      - id: nbqa-ruff-format
        additional_dependencies: [ruff==0.16.8]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ".ipynb"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: deps-age
        name: deps age gate (latest but >=1 week old)
        entry: uv run python scripts/python/intern.py deps
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
      - id: agents-skills-table
        name: AGENTS.md skills table in sync
        entry: uv run python scripts/python/sync_agents_md.py --check
        language: system
        files: "^(AGENTS\\.md|\\.claude/skills/.*)$"
        pass_filenames: false
